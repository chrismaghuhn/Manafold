name: Nightly Certification Smoke
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  certification-smoke:
    runs-on: ubuntu-latest
    steps:
      # Certification includes the integration checks, whose M2.B
      # historical-fixture evidence resolves the starting SHA via git; a
      # shallow checkout cannot run them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version-file: ".python-version"}
      - name: Bootstrap project environment
        run: python scripts/bootstrap.py
        timeout-minutes: 10
      - run: |
          rustup toolchain uninstall 1.85.1 || true
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: .venv/bin/python scripts/run_checks.py certification
