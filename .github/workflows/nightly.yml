name: Nightly Certification Smoke
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  certification-smoke:
    runs-on: ubuntu-latest
    steps:
      # Certification includes the integration checks, whose M2.B
      # historical-fixture evidence resolves the starting SHA via git; a
      # shallow checkout cannot run them.
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version-file: ".python-version"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: |
          rustup toolchain uninstall 1.85.1 || true
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_checks.py certification
