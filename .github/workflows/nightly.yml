name: Nightly Certification Smoke
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  certification-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13.5"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy --force
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_checks.py certification
