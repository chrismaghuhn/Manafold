name: PR Integration
on:
  pull_request: {}
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: pr-integration-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v7
        with: {python-version-file: ".python-version"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: |
          rustup toolchain uninstall 1.85.1 || true
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_checks.py integration

  manafold-pr-gate:
    name: manafold-pr-gate
    if: ${{ always() }}
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Assert exact pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Evaluate mandatory pull-request checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100&filter=latest" \
              > "${RUNNER_TEMP}/manafold-check-runs.json"
            set +e
            python scripts/aggregate_pr_gate.py \
              --head-sha "$HEAD_SHA" \
              --check-runs "${RUNNER_TEMP}/manafold-check-runs.json" \
              --wait
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$result" -ne 10 ]; then
              exit "$result"
            fi
            sleep 10
          done
          echo "FAIL: timed out waiting for mandatory pull-request checks" >&2
          exit 1
