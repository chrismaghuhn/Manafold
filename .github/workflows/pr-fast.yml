name: PR Fast
on: {pull_request: {}}
permissions: {contents: read}
concurrency:
  group: pr-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v7
        with: {python-version-file: ".python-version"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: python scripts/run_checks.py fast
      - name: Assert clean source before M2.B gate
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || { printf '%s\n' "$status"; exit 1; }
      - run: |
          rustup toolchain uninstall 1.85.1 || true
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - run: |
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 check --workspace --all-targets --all-features --locked
      - run: python scripts/run_m2_b_contract_cut.py
      - name: Assert clean source before M2.C gates
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || { printf '%s\n' "$status"; exit 1; }
      - run: python scripts/run_m2_c_gates.py
      - name: Assert clean source before M2.D gates
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || { printf '%s\n' "$status"; exit 1; }
      - run: python scripts/run_m2_d_gates.py
      - name: Assert clean source before M2.E gates
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || { printf '%s\n' "$status"; exit 1; }
      - run: python scripts/run_m2_e_gates.py
