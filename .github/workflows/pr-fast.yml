name: PR Fast
on: {pull_request: {}}
permissions: {contents: read}
concurrency:
  group: pr-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with: {python-version: "3.13.5"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: python scripts/run_checks.py fast
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - run: |
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 check --workspace --all-targets --all-features --locked
