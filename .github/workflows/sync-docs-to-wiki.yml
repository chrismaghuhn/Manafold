name: Sync docs/ to Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'PROJECT_CHARTER.md'
      - 'README.md'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: chrismaghuhn/Manafold.wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki
          fetch-depth: 0

      - name: Configure git
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync docs/ to wiki
        run: |
          cd wiki

          # Process docs/
          if [ -d "../docs" ]; then
            for file in ../docs/*.md; do
              [ -f "$file" ] || continue
              basename=$(basename "$file" .md)
              wiki_name=$(echo "$basename" | sed 's/_/ /g')
              cp "$file" "$wiki_name.md"
              echo "Copied: $file -> $wiki_name.md"
            done
          fi

          # Process root-level key files
          for file in ../PROJECT_CHARTER.md ../README.md ../ROADMAP.md; do
            [ -f "$file" ] || continue
            basename=$(basename "$file" .md)
            wiki_name=$(echo "$basename" | sed 's/_/ /g')
            cp "$file" "$wiki_name.md"
            echo "Copied: $file -> $wiki_name.md"
          done

          # Also copy docs/contracts/ if exists
          if [ -d "../docs/contracts" ]; then
            for file in ../docs/contracts/*.md; do
              [ -f "$file" ] || continue
              basename=$(basename "$file" .md)
              wiki_name=$(echo "$basename" | sed 's/_/ /g')
              cp "$file" "$wiki_name.md"
              echo "Copied: $file -> $wiki_name.md"
            done
          fi

      - name: Generate _Sidebar.md
        run: |
          cd wiki
          python3 -c "sidebar = '# Manafold Wiki Navigation\n\n## Getting Started\n- [Home](Home)\n- [Project Charter](PROJECT_CHARTER)\n- [README](README)\n- [Roadmap](ROADMAP)\n\n## Architecture & Design\n- [Architecture](ARCHITECTURE)\n- [Domain Model](DOMAIN_MODEL)\n- [Execution Model](EXECUTION_MODEL)\n- [Normative Hierarchy](NORMATIVE_HIERARCHY)\n\n## Specifications\n- [M0.2 Specification](M0_2_SPECIFICATION)\n- [V0.2.2 Executable Freeze](V0_2_2_EXECUTABLE_FREEZE_AND_MAINTAINER_ERGONOMICS)\n- [V0.2.1 Contract Closure](V0_2_1_CONTRACT_CLOSURE)\n\n## Contracts\n- [Design Lock Matrix](M0_2_DESIGN_LOCK_MATRIX)\n- [Acceptance Gates](ACCEPTANCE_GATES)\n\n## Development\n- [Developer Setup](DEVELOPER_SETUP)\n- [Verification Gates](VERIFICATION_GATES)\n'; open('_Sidebar.md', 'w').write(sidebar); print('Generated _Sidebar.md')"

      - name: Generate _Footer.md
        run: |
          cd wiki
          python3 -c "from datetime import datetime; footer = '---\n*Auto-synced from [chrismaghuhn/Manafold](https://github.com/chrismaghuhn/Manafold) on every push to master.*\n*Last sync: {datetime.utcnow().strftime(\"%Y-%m-%d %H:%M UTC\")}*\n*[View source](https://github.com/chrismaghuhn/Manafold/tree/master/docs)*\n'; open('_Footer.md', 'w').write(footer); print('Generated _Footer.md')"

      - name: Generate Home.md
        run: |
          cd wiki
          python3 -c "import os; home_path='Home.md'; home_content='# Manafold Wiki\n\nWelcome to the **Manafold** documentation wiki - automatically synced from the [docs/](https://github.com/chrismaghuhn/Manafold/tree/master/docs) folder of the main repository.\n\n## What is Manafold?\n\n**Manafold** is a deterministic, inspectable, and high-performance **Magic: The Gathering rules engine** designed for ML agents. It provides:\n\n- **Exact information projection** - agents receive only what they may know\n- **Complete legal decision construction** - every legal choice in certified scope\n- **Full reproducibility** - every episode step from versioned artifacts\n- **Formal verification** - strict lifecycle: Imported - Parsed - Implemented - Covered - Certified\n\n> **Current Status:** V0.2.2 - Executable Freeze & Maintainer Ergonomics\n> **Next Milestone:** M1 - Closed Deterministic Kernel Shell\n> **License:** Apache-2.0\n\n## Quick Links\n\n| Area | Links |\n|------|-------|\n| **Start Here** | [Project Charter](PROJECT_CHARTER) - [README](README) - [Roadmap](ROADMAP) |\n| **Architecture** | [Architecture](ARCHITECTURE) - [Domain Model](DOMAIN_MODEL) - [Execution Model](EXECUTION_MODEL) |\n| **Specifications** | [M0.2 Spec](M0_2_SPECIFICATION) - [V0.2.2 Freeze](V0_2_2_EXECUTABLE_FREEZE_AND_MAINTAINER_ERGONOMICS) |\n| **Contracts** | [Design Lock Matrix](M0_2_DESIGN_LOCK_MATRIX) - [Acceptance Gates](ACCEPTANCE_GATES) |\n| **Development** | [Developer Setup](DEVELOPER_SETUP) - [Verification Gates](VERIFICATION_GATES) - [Crates Reference](CRATES_REFERENCE) |\n\n## Core Crates (Rust)\n\n| Crate | Role |\n|-------|------|\n| mtgml-state | **Sole State Owner** - EngineState, Identities, RNG, Format State |\n| mtgml-rules | RulesKernel, TransitionProduct, Semantic Events |\n| mtgml-decision | Hierarchical Decisions, Continuations |\n| mtgml-observation | ObservationProjector, Information State, Perspective-Bound Views |\n| mtgml-environment | TrustedEnvironmentController, Checkpoint/Fork/Replay |\n| mtgml-random | Deterministic ID/RNG Streams |\n| mtgml-replay | Authoritative Replay Export |\n| mtgml-conformance | Conformance Assertions, Test Harnesses |\n| mtgml-card-ir | Typed Card IR (Reviewed - Certified) |\n| mtgml-wire | Cross-Language Rust/Python/JSON Fixtures |\n| mtgml-model | Rules-free ML Process |\n| mtgml-commander | Commander-specific Tracking |\n\n## Roadmap Overview\n\n| Milestone | Target | Status |\n|-----------|--------|--------|\n| M0.2 | Specification & Maintainer Readiness | Done |\n| V0.2.1 | Executable Contract Closure | Done |\n| V0.2.2 | Executable Freeze & Maintainer Ergonomics | Current |\n| M1 | Closed Deterministic Kernel Shell | Next |\n| M2 | Decision Machinery & Information Safety | Planned |\n| M2.5 | Exact V1 Deck Lock & Capability Census | Planned |\n| M3 | Required Magic Primitives | Planned |\n| M4 | Card Definitions & Certified V1 Bundle | Planned |\n| M5 | ML Environment & Baselines | Planned |\n\n## Verification\n\n```bash\n# Quick checks\njust check-fast\n```\n\n```bash\n# Full verification (pre-merge / release)\njust check-all\n```\n\n```bash\n# Release candidate\njust release-candidate\n```\n\n## External Links\n\n- [GitHub Repository](https://github.com/chrismaghuhn/Manafold)\n- [Issues](https://github.com/chrismaghuhn/Manafold/issues)\n- [Discussions](https://github.com/chrismaghuhn/Manafold/discussions)\n- [Releases](https://github.com/chrismaghuhn/Manafold/releases)\n'; open(home_path, 'w').write(home_content) if not os.path.exists(home_path) else None; print('Generated Home.md' if not os.path.exists(home_path) else 'Home.md already exists, skipping')"

      - name: Commit and push wiki changes
        run: |
          cd wiki
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "docs: auto-sync from main repo $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push origin master
          echo "Wiki updated successfully"
