name: Sync docs/ to Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'PROJECT_CHARTER.md'
      - 'README.md'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: chrismaghuhn/Manafold.wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki
          fetch-depth: 0

      - name: Configure git
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync docs/ to wiki
        run: |
          cd wiki

          # Process docs/
          if [ -d "../docs" ]; then
            for file in ../docs/*.md; do
              [ -f "$file" ] || continue
              basename=$(basename "$file" .md)
              wiki_name=$(echo "$basename" | sed 's/_/ /g')
              cp "$file" "$wiki_name.md"
              echo "Copied: $file -> $wiki_name.md"
            done
          fi

          # Process root-level key files
          for file in ../PROJECT_CHARTER.md ../README.md ../ROADMAP.md; do
            [ -f "$file" ] || continue
            basename=$(basename "$file" .md)
            wiki_name=$(echo "$basename" | sed 's/_/ /g')
            cp "$file" "$wiki_name.md"
            echo "Copied: $file -> $wiki_name.md"
          done

          # Also copy docs/contracts/ if exists
          if [ -d "../docs/contracts" ]; then
            for file in ../docs/contracts/*.md; do
              [ -f "$file" ] || continue
              basename=$(basename "$file" .md)
              wiki_name=$(echo "$basename" | sed 's/_/ /g')
              cp "$file" "$wiki_name.md"
              echo "Copied: $file -> $wiki_name.md"
            done
          fi

      - name: Generate _Sidebar.md
        run: |
          cd wiki
          cat > _Sidebar.md << 'SIDEBAR_EOF'
# Manafold Wiki Navigation

## Getting Started
- [Home](Home)
- [Project Charter](PROJECT_CHARTER)
- [README](README)
- [Roadmap](ROADMAP)

## Architecture & Design
- [Architecture](ARCHITECTURE)
- [Domain Model](DOMAIN_MODEL)
- [Execution Model](EXECUTION_MODEL)
- [Normative Hierarchy](NORMATIVE_HIERARCHY)

## Specifications
- [M0.2 Specification](M0_2_SPECIFICATION)
- [V0.2.2 Executable Freeze](V0_2_2_EXECUTABLE_FREEZE_AND_MAINTAINER_ERGONOMICS)
- [V0.2.1 Contract Closure](V0_2_1_CONTRACT_CLOSURE)

## Contracts
- [Design Lock Matrix](M0_2_DESIGN_LOCK_MATRIX)
- [Acceptance Gates](ACCEPTANCE_GATES)

## Development
- [Developer Setup](DEVELOPER_SETUP)
- [Verification Gates](VERIFICATION_GATES)
- [Crates Reference](CRATES_REFERENCE)

## External Links
- [GitHub Repository](https://github.com/chrismaghuhn/Manafold)
- [Issues](https://github.com/chrismaghuhn/Manafold/issues)
- [Discussions](https://github.com/chrismaghuhn/Manafold/discussions)
- [Releases](https://github.com/chrismaghuhn/Manafold/releases)
SIDEBAR_EOF
          echo "Generated _Sidebar.md"

      - name: Generate _Footer.md
        run: |
          cd wiki
          cat > _Footer.md << 'FOOTER_EOF'
---
*Auto-synced from [chrismaghuhn/Manafold](https://github.com/chrismaghuhn/Manafold) on every push to master.*
*Last sync: $(date -u +"%Y-%m-%d %H:%M UTC")*
*[View source](https://github.com/chrismaghuhn/Manafold/tree/master/docs)*
FOOTER_EOF
          echo "Generated _Footer.md"

      - name: Generate Home.md
        run: |
          cd wiki
          if [ ! -f "Home.md" ] || ! grep -q "Manafold Wiki" "Home.md"; then
            cat > Home.md << 'HOME_EOF'
# Manafold Wiki

Welcome to the **Manafold** documentation wiki - automatically synced from the [docs/](https://github.com/chrismaghuhn/Manafold/tree/master/docs) folder of the main repository.

## What is Manafold?

**Manafold** is a deterministic, inspectable, and high-performance **Magic: The Gathering rules engine** designed for ML agents. It provides:

- **Exact information projection** - agents receive only what they may know
- **Complete legal decision construction** - every legal choice in certified scope
- **Full reproducibility** - every episode step from versioned artifacts
- **Formal verification** - strict lifecycle: Imported - Parsed - Implemented - Covered - Certified

> **Current Status:** V0.2.2 - Executable Freeze & Maintainer Ergonomics
> **Next Milestone:** M1 - Closed Deterministic Kernel Shell
> **License:** Apache-2.0

