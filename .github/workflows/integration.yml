name: Integration
on:
  push: {branches: [master]}
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13.5"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy --force
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_checks.py integration
  python-compatibility:
    strategy:
      fail-fast: false
      matrix: {python: ["3.11", "3.12", "3.13"]}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: PYTHONPATH=python/src python -m pytest python/tests
