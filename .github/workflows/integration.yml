name: Integration
on:
  push: {branches: [master]}
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      # The M2.B historical-fixture evidence resolves the starting SHA via
      # git; a shallow checkout cannot run the integration suite.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version-file: ".python-version"}
      - name: Bootstrap project environment
        run: python scripts/bootstrap.py
        timeout-minutes: 10
      - run: |
          rustup toolchain uninstall 1.85.1 || true
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: .venv/bin/python scripts/run_checks.py integration
  python-compatibility:
    strategy:
      fail-fast: false
      matrix: {python: ["3.11", "3.12", "3.13"]}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "${{ matrix.python }}"}
      - run: |
          python -m pip install -r python/requirements-dev.lock
          python -m pip install --no-deps -e python
      - run: PYTHONPATH=python/src python -m pytest python/tests
        timeout-minutes: 10
