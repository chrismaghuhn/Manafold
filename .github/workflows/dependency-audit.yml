name: Dependency Audit
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
      - name: Install pinned Manafold Rust toolchain
        shell: bash
        timeout-minutes: 10
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Bootstrap project environment
        shell: bash
        timeout-minutes: 10
        run: python scripts/bootstrap.py
      - name: Install pinned pip-audit
        shell: bash
        timeout-minutes: 10
        run: |
          audit_dir="${RUNNER_TEMP}/manafold-pip-audit"
          python -m venv "$audit_dir"
          "$audit_dir/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "pip-audit==2.10.1"
          echo "PIP_AUDIT_PYTHON=$audit_dir/bin/python" >> "$GITHUB_ENV"
      - name: Install pinned cargo-audit
        shell: bash
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          audit_root="${RUNNER_TEMP}/manafold-cargo-audit"
          cargo +1.88.0 install cargo-audit \
            --version 0.22.2 \
            --locked \
            --root "$audit_root"
          echo "RUST_AUDIT_EXECUTABLE=$audit_root/bin/cargo-audit" >> "$GITHUB_ENV"
      - name: Run dependency audit
        shell: bash
        timeout-minutes: 10
        run: |
          .venv/bin/python scripts/run_dependency_audit.py \
            --rust-audit-executable "$RUST_AUDIT_EXECUTABLE" \
            --python-audit-python "$PIP_AUDIT_PYTHON"
