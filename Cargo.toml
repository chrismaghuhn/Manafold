[workspace]
resolver = "2"
members = [
  "crates/mtgml-model",
  "crates/mtgml-random",
  "crates/mtgml-decision",
  "crates/mtgml-state",
  "crates/mtgml-card-ir",
  "crates/mtgml-rules",
  "crates/mtgml-observation",
  "crates/mtgml-replay",
  "crates/mtgml-wire",
  "crates/mtgml-environment",
  "crates/mtgml-commander",
  "crates/mtgml-conformance",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.85.1"
authors = ["MTG ML Engine contributors"]

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
