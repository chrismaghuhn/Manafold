[package]
name = "mtgml-environment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Historical V5/V6 execution surfaces are retained only for the isolated
# conformance and migration tools which explicitly request them.
historical-conformance-runtime = ["mtgml-rules/historical-runtime-testkit"]

[dependencies]
base64.workspace = true
mtgml-decision = { path = "../mtgml-decision" }
mtgml-card-ir = { path = "../mtgml-card-ir" }
mtgml-model = { path = "../mtgml-model" }
mtgml-observation = { path = "../mtgml-observation" }
mtgml-persistence = { path = "../mtgml-persistence" }
mtgml-random = { path = "../mtgml-random" }
mtgml-rules = { path = "../mtgml-rules" }
mtgml-replay = { path = "../mtgml-replay" }
mtgml-state = { path = "../mtgml-state" }
mtgml-wire = { path = "../mtgml-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Test-only access to the M2.E lifecycle fixture driver; never enabled for
# production builds of this crate.
mtgml-rules = { path = "../mtgml-rules", features = ["synthetic-conformance-fixtures", "historical-runtime-testkit"] }
