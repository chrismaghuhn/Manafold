[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgml"
version = "0.2.2"
description = "Rules-free Python contracts for the MTG ML engine"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtgml = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mtgml"]
mypy_path = ["src"]
