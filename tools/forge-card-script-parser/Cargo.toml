[package]
name = "forge-card-script-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"

[workspace]

[[bin]]
name = "forge-card-script"
path = "src/main.rs"

[[bin]]
name = "forge-card-lower"
path = "src/lower_main.rs"

[dependencies]
mtgml-card-ir = { path = "../../crates/mtgml-card-ir" }
mtgml-model = { path = "../../crates/mtgml-model" }
mtgml-persistence = { path = "../../crates/mtgml-persistence" }
serde_json = "=1.0.143"
sha2 = "=0.11.0"
